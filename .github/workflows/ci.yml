name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install .
      - name: Check the installed command
        run: aem version
      - name: Diagnose a fresh machine (warnings only, must not fail)
        run: aem doctor --json
      - name: Scenario tests (22 cases, disposable fake homes)
        run: python evals/run_tests.py
      - name: End-to-end demo (includes an expected conflict exit code)
        run: python demo/run_demo.py
